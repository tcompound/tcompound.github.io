<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T Compound | Development Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090a0f;
            --surface-card: #12141c;
            --border-subtle: rgba(255, 255, 255, 0.07);
            --border-hover: rgba(255, 255, 255, 0.18);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --text-dim: #6b7280;
            --font-heading: 'Space Grotesk', -apple-system, sans-serif;
            --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(120, 119, 198, 0.12), transparent),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        /* Floating Navigation Header */
        header {
            position: fixed;
            top: 20px;
            z-index: 100;
            background: rgba(18, 20, 28, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            padding: 6px 12px 6px 18px;
            border-radius: 99px;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
        }

        .nav-logo-img {
            height: 20px;
            width: auto;
            display: block;
            border-radius: 4px;
        }

        .nav-title {
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: -0.02em;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 99px;
            transition: all 0.2s ease;
        }

        nav a:hover, nav a.active {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .container {
            width: 100%;
            max-width: 960px;
            padding: 0 24px;
        }

        /* Hero Section */
        .hero {
            margin-top: 180px;
            margin-bottom: 120px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-logo-wrapper {
            position: relative;
            margin-bottom: 28px;
        }

        .hero-logo {
            width: 110px;
            height: auto;
            display: block;
            position: relative;
            z-index: 2;
            border-radius: 12px;
        }

        .brand-title {
            font-family: var(--font-heading);
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text-main);
            margin-bottom: 12px;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 32px;
            max-width: 540px;
            font-weight: 400;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 10px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--border-hover);
        }

        .btn-primary {
            background: var(--text-main);
            color: var(--bg-dark);
            border-color: var(--text-main);
        }

        .btn-primary:hover {
            background: #e5e7eb;
            border-color: #e5e7eb;
        }

        /* Minimal Footer */
        footer {
            margin-top: auto;
            width: 100%;
            border-top: 1px solid var(--border-subtle);
            padding: 32px 0;
            display: flex;
            justify-content: center;
            background: rgba(9, 10, 15, 0.8);
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .footer-left img {
            height: 18px;
            width: auto;
            border-radius: 3px;
        }

        .footer-left p {
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        .footer-nav {
            display: flex;
            gap: 20px;
        }

        .footer-nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .footer-nav a:hover {
            color: var(--text-main);
        }

        @media (max-width: 640px) {
            .brand-title { font-size: 2.5rem; }
            .hero-logo { width: 90px; }
            .footer-content { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="nav-brand">
            <img src="Screenshot 2026-08-16 231534.png" alt="T Compound Logo" class="nav-logo-img">
            <span class="nav-title">T COMPOUND</span>
        </a>
        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="services.html">Services</a>
            <a href="team.html">Team</a>
            <a href="https://discord.gg/d57aBGqqAv" target="_blank">Discord</a>
        </nav>
    </header>

    <div class="container">
        <section class="hero">
            <div class="hero-logo-wrapper">
                <img src="Screenshot 2026-08-16 231534.png" alt="T Compound Logo" class="hero-logo">
            </div>
            <h1 class="brand-title">T COMPOUND</h1>
            <p class="subtitle">Custom FiveM development, tailored web interfaces, and automated Discord integrations built for performance.</p>
            
            <div class="btn-group">
                <a href="https://discord.gg/d57aBGqqAv" target="_blank" class="btn btn-primary">
                    <i class="fab fa-discord"></i> Join Discord
                </a>
                <a href="services.html" class="btn">
                    Explore Services <i class="fas fa-arrow-right"></i>
                </a>
            </div>
        </section>
    </div>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-left">
                    <img src="Screenshot 2026-08-16 231534.png" alt="T Compound Logo">
                    <p>&copy; T Compound. All rights reserved.</p>
                </div>

                <div class="footer-nav">
                    <a href="index.html">Home</a>
                    <a href="services.html">Services</a>
                    <a href="team.html">Team</a>
                    <a href="https://discord.gg/d57aBGqqAv" target="_blank">Discord</a>
                </div>
            </div>
        </div>
    </footer>

</body>
</html>
