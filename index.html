<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Studio | High Quality Assets & Development</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090a0f;
            --surface-card: #12141c;
            --border-subtle: rgba(255, 255, 255, 0.07);
            --border-hover: rgba(255, 255, 255, 0.18);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --text-dim: #6b7280;
            --font-heading: 'Space Grotesk', -apple-system, sans-serif;
            --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(120, 119, 198, 0.12), transparent),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        header {
            position: fixed;
            top: 20px;
            z-index: 100;
            background: rgba(18, 20, 28, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            padding: 6px 12px 6px 18px;
            border-radius: 99px;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-main); }
        .nav-logo-img { height: 20px; width: auto; border-radius: 4px; }
        .nav-title { font-family: var(--font-heading); font-weight: 700; font-size: 0.95rem; }

        nav { display: flex; align-items: center; gap: 4px; }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 99px;
            transition: all 0.2s ease;
        }
        nav a:hover, nav a.active { color: var(--text-main); background: rgba(255, 255, 255, 0.05); }

        .container { width: 100%; max-width: 960px; padding: 0 24px; }
        
        .hero {
            margin-top: 180px;
            margin-bottom: 80px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            padding: 6px 16px;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .hero-title {
            font-family: var(--font-heading);
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        .hero-subtitle {
            color: var(--text-muted);
            font-size: 1.15rem;
            max-width: 600px;
            margin-bottom: 32px;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-primary {
            background: var(--text-main);
            color: var(--bg-dark);
            padding: 12px 28px;
            border-radius: 99px;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover { transform: translateY(-2px); opacity: 0.9; }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
            padding: 12px 28px;
            border-radius: 99px;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--border-hover); }

        footer {
            margin-top: auto;
            width: 100%;
            border-top: 1px solid var(--border-subtle);
            padding: 32px 0;
            display: flex;
            justify-content: center;
            background: rgba(9, 10, 15, 0.8);
        }

        .footer-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
        .footer-left { display: flex; align-items: center; gap: 12px; }
        .footer-left img { height: 18px; width: auto; border-radius: 3px; }
        .footer-left p { color: var(--text-dim); font-size: 0.85rem; }
        .footer-nav { display: flex; gap: 20px; }
        .footer-nav a { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; }
        .footer-nav a:hover { color: var(--text-main); }
    </style>
</head>
<body>

    <header>
        <a href="./" class="nav-brand">
            <img src="istockphoto-653952686-612x612.jpg" alt="Light Studio Logo" class="nav-logo-img">
            <span class="nav-title">LIGHT STUDIO</span>
        </a>
        <nav>
            <a href="./" class="active">Home</a>
            <a href="services">Services</a>
            <a href="team">Team</a>
            <a href="https://discord.gg/d57aBGqqAv" target="_blank">Discord</a>
        </nav>
    </header>

    <div class="container">
        <section class="hero">
            <div class="hero-badge">
                <i class="fas fa-sparkles"></i> High Quality Custom Development
            </div>
            <h1 class="hero-title">Welcome to Light Studio</h1>
            <p class="hero-subtitle">We craft premium scripts, custom Discord bots, and tailored digital solutions for your community.</p>
            <div class="hero-buttons">
                <a href="https://discord.gg/d57aBGqqAv" target="_blank" class="btn-primary">
                    <i class="fab fa-discord"></i> Join Discord
                </a>
                <a href="team" class="btn-secondary">Meet the Team</a>
            </div>
        </section>
    </div>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-left">
                    <img src="istockphoto-653952686-612x612.jpg" alt="Light Studio Logo">
                    <p>&copy; Light Studio. All rights reserved.</p>
                </div>

                <div class="footer-nav">
                    <a href="./">Home</a>
                    <a href="services">Services</a>
                    <a href="team">Team</a>
                    <a href="https://discord.gg/d57aBGqqAv" target="_blank">Discord</a>
                </div>
            </div>
        </div>
    </footer>

</body>
</html>
